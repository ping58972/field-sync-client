name: Mobile sync verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: client
      - uses: actions/checkout@v5
        with:
          repository: ping58972/meter-reading-api
          path: backend
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend/src/Meter.Api -c Release
      - run: npm ci
        working-directory: client
      - run: npm run typecheck && npm test && npm audit --audit-level=moderate
        working-directory: client
      - run: npx tsx tools/integration.ts ../backend/src/Meter.Api/bin/Release/net10.0/Meter.Api.dll
        working-directory: client
      - run: npm run export:android
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: client/dist
